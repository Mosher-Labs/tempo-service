[project]
name = "tempo-service"
version = "0.1.0"
description = "Self-hosted song tempo lookup: iTunes preview -> Essentia BPM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Newest Essentia with Python 3.12 wheels for Linux and macOS. Later
    # builds ship cp314 wheels only.
    "essentia==2.1b6.dev1389",
    "fastapi==0.121.2",
    "uvicorn==0.38.0",
    "requests==2.32.5",
]

# Flat modules (app.py, analyzer.py), not an installable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
